    <circle cx="480" cy="300" r="6" fill="#3987e5"/>
    <circle cx="720" cy="300" r="6" fill="#3987e5"/>
  </g>

  <!-- wordmark -->
  <text x="120" y="140" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="56" font-weight="700" fill="#ffffff">
